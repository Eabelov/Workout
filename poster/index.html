<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HEELS — танцы на каблуках</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <article class="poster" aria-label="Афиша танцев на каблуках">
        <img
          class="poster__photo"
          src="./assets/heels-dancer.jpg"
          alt="Танцовщица на каблуках в красном свете"
          width="3024"
          height="4032"
        />

        <div class="poster__veil" aria-hidden="true"></div>

        <header class="poster__brand">
          <p class="poster__studio">студия женского танца</p>
          <h1 class="poster__logo">HEELS</h1>
        </header>

        <section class="poster__copy">
          <h2 class="poster__headline">
            Раскрой свою<br />женственность
          </h2>
          <p class="poster__lead">
            Танцы на каблуках для тех, кто хочет чувствовать себя уверенно,
            красиво и желанно — даже если никогда не танцевала.
          </p>
          <div class="poster__cta">
            <a class="btn" href="#signup">Записаться на пробное</a>
            <p class="poster__note">Первое занятие — без обязательств</p>
          </div>
        </section>
      </article>
    </main>
  </body>
</html>
