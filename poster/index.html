<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HEELS — танцы на каблуках</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <article class="poster" aria-label="Афиша танцев на каблуках">
        <div class="poster__visual">
          <img
            class="poster__photo"
            src="./assets/heels-dancer-crop.jpg"
            alt="Танцовщица на каблуках в красном свете"
            width="2542"
            height="2096"
          />
          <div class="poster__veil" aria-hidden="true"></div>
          <header class="poster__brand">
            <p class="poster__studio">студия женского танца</p>
            <h1 class="poster__logo">HEELS</h1>
          </header>
        </div>

        <div class="poster__panel">
          <h2 class="poster__headline">Раскрой свою женственность</h2>
          <p class="poster__lead">
            Танцы на каблуках — уверенность, красота и желанность
            с&nbsp;первого занятия.
          </p>
          <div class="poster__cta">
            <a class="btn" href="#signup">Записаться на пробное</a>
            <p class="poster__note">Первое занятие — без обязательств</p>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
